<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout(tittle, content)" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gameshop</title>
    <link rel="stylesheet" th:href="@{/styles.css}">
</head>
<body>

    <nav>
        <a th:href="@{/juegos}" class="nav-brand"> GamesShop</a>
        <div class="nav-links">
            <a th:href="@{/juegos}">Inicio</a>
            <a th:href="@{/fragments-demo}" style ="color:var(--green); margin-left: 2rem;">Fragmentos</a>

            <th:block th:if="${session.usuario_id != null}">
                <a th:href="@{/mis-juegos}">Mis Juego</a>
                <a th:href="@{/juegos/nuevo}">Subir juego</a>
                <a th:href="@{/logout}">Cerrar Sesión</a>
            </th:block>

            <th:block th:if="${session.usuario_id == null}">
                <a th:href="@{/login}">Iniciar Sesion</a>
                <a th:href="@{/registro}">Registrarse</a>
            </th:block>

        </div>
    </nav>

    <main class ="container" th:replace="${content}">
        Contenido por defecto.
    </main>
</body>
</html>
